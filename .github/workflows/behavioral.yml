name: behavioral

# Behavioral tests run a real agent against a skill and grade what it did (see
# eval/behavioral/). They cost real API tokens and, for some skills, install
# and exercise local models. The design:
#
#   * selective -- only the skills whose folder or test changed are run (the
#     whole suite runs when the shared harness changes). See
#     .github/scripts/select_behavioral.py.
#   * required when relevant -- when a PR changes a skill or test that maps to a
#     behavioral test, the `behavioral` gate FAILS until the tests pass. A PR
#     that touches nothing testable passes neutrally.
#   * dispatchable -- run any subset by hand from the Actions tab.
#   * opt-in for Instinct -- the MI300X leg is scarce and expensive, so it only
#     runs on PRs carrying the `enable_mi_ci` label (see behavioral-instinct).
#
# This workflow also hosts the *routing* eval (see the `routing` job and
# eval/routing/): where a behavioral test asks "once this skill runs, does it
# work?", the routing eval asks "with the whole published catalog installed,
# does the agent pick the right skill at all?". It is dispatch-only -- pick
# `routing` from the `mode` dropdown when you run this workflow by hand.
#
# Shape mirrors validate.yml: discover -> matrix -> single aggregate gate, so
# branch protection can require just the `behavioral` check.

on:
  pull_request:
    # `labeled` is here so adding `enable_mi_ci` to an open PR starts the
    # MI300X leg. Re-running an existing run would not work: the replayed
    # event payload is the one from before the label was applied.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "skills/**"
      - "eval/behavioral/**"
      - "eval/claude_eval.py"
      - ".github/workflows/behavioral.yml"
      - ".github/scripts/select_behavioral.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "behavioral = per-skill behavioral tests. routing = the skill-routing eval over eval/routing/prompts.json. both = run each."
        type: choice
        required: false
        default: behavioral
        options:
          - behavioral
          - routing
          - both
      skills:
        description: "Comma-separated skill names to test (blank = every skill that has a behavioral test). Ignored when mode is routing."
        required: false
        default: ""

concurrency:
  group: behavioral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which skills the change affects. This is secret-free (just git diff +
  # a Python mapping). Its `any` output drives whether the behavioral job runs
  # and whether the gate has anything to enforce for this PR.
  discover:
    name: Select behavioral tests
    runs-on: ubuntu-latest
    outputs:
      strix_skills: ${{ steps.select.outputs.strix_skills }}
      strix_any: ${{ steps.select.outputs.strix_any }}
      # Which Instinct skills the change touches, and whether it touches any
      # of them at all...
      instinct_skills: ${{ steps.select.outputs.instinct_skills }}
      instinct: ${{ steps.select.outputs.instinct }}
      # ...versus whether they should actually run, which also needs the label.
      instinct_run: ${{ steps.select.outputs.instinct_run }}
      # Which of the two evals this run is for (see the `mode` dispatch input).
      run_routing: ${{ steps.select.outputs.run_routing }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need the merge base so `git diff` can see what the PR changed.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Select skills
        id: select
        run: |
          set -euo pipefail
          # The routing eval is dispatch-only: it costs tokens on every prompt
          # and answers a catalog-wide question, so it is never worth running
          # automatically on a PR that touches one skill.
          run_behavioral=true
          run_routing=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.mode }}" in
              routing) run_behavioral=false; run_routing=true ;;
              both)    run_routing=true ;;
            esac
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.skills }}" ]; then
              skills=$(uv run .github/scripts/select_behavioral.py --names "${{ github.event.inputs.skills }}")
            else
              skills=$(uv run .github/scripts/select_behavioral.py --all)
            fi
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            skills=$(git diff --name-only "$base" "$head" \
              | uv run .github/scripts/select_behavioral.py --changed)
          fi

          # Routing-only run: empty the behavioral matrix. Every downstream
          # flag is derived from this list, so the strix and Instinct legs skip
          # and the gate correctly has nothing to enforce for them.
          if [ "$run_behavioral" != "true" ]; then
            skills="[]"
          fi
          echo "Mode: ${{ github.event.inputs.mode }} (behavioral: $run_behavioral, routing: $run_routing)"
          echo "Selected skills: $skills"

          # These skills exercise AMD Instinct GPUs, so they must run on the
          # MI300X runner rather than the strix_halo ones. Split them out into
          # their own list/flag; everything else stays on the existing
          # strix_halo matrix. Space-separated, one name per skill.
          instinct_names="serving-llms-on-instinct hyperloom-workload-optimizer"
          strix=$(printf '%s' "$skills" | INSTINCT="$instinct_names" python3 -c \
            "import sys,os,json;mi=os.environ['INSTINCT'].split();print(json.dumps([s for s in json.load(sys.stdin) if s not in mi]))")
          instinct_skills=$(printf '%s' "$skills" | INSTINCT="$instinct_names" python3 -c \
            "import sys,os,json;mi=os.environ['INSTINCT'].split();sel=json.load(sys.stdin);print(json.dumps([s for s in mi if s in sel]))")
          if [ "$instinct_skills" = "[]" ]; then
            has_instinct=false
          else
            has_instinct=true
          fi

          # The MI300X runner is a scarce shared resource, so touching one of
          # those skills is necessary but not sufficient: a maintainer has to
          # opt the PR in with the `enable_mi_ci` label. A manual dispatch is
          # already explicit human intent, so it does not need the label.
          mi_label="${{ contains(github.event.pull_request.labels.*.name, 'enable_mi_ci') }}"
          instinct_run=false
          if [ "$has_instinct" = "true" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$mi_label" = "true" ]; then
              instinct_run=true
            fi
          fi

          echo "strix_skills=$strix"
          echo "instinct_skills=$instinct_skills (enable_mi_ci label: $mi_label -> run: $instinct_run)"
          echo "strix_skills=$strix" >> "$GITHUB_OUTPUT"
          echo "instinct_skills=$instinct_skills" >> "$GITHUB_OUTPUT"
          echo "instinct=$has_instinct" >> "$GITHUB_OUTPUT"
          echo "instinct_run=$instinct_run" >> "$GITHUB_OUTPUT"
          echo "run_routing=$run_routing" >> "$GITHUB_OUTPUT"
          if [ "$strix" = "[]" ]; then
            echo "strix_any=false" >> "$GITHUB_OUTPUT"
          else
            echo "strix_any=true" >> "$GITHUB_OUTPUT"
          fi

  behavioral:
    name: Behavioral (${{ matrix.skill }} on ${{ matrix.os }})
    needs: discover
    # Run whenever the change affects a strix_halo-testable skill.
    if: needs.discover.outputs.strix_any == 'true'
    # Self-hosted Strix Halo runners. The OS label (Linux / Windows) comes from
    # the matrix below so each skill is exercised on both platforms.
    runs-on: [self-hosted, strix_halo, "${{ matrix.os }}"]
    # Behavioral runs install local models and can take a while; cap it so a
    # hung agent or stalled model pull fails the job instead of burning minutes.
    timeout-minutes: 45
    strategy:
      # One skill / OS failing should not hide the others' results.
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.strix_skills) }}
        os: [Linux, Windows]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ORCHESTR_API_KEY }}
      ANTHROPIC_BASE_URL: https://llm-api.amd.com/Anthropic
      ANTHROPIC_CUSTOM_HEADERS: |
        Ocp-Apim-Subscription-Key: ${{ secrets.ORCHESTR_API_KEY }}
        user: a1_ucicd
      # Lets the harness default to this skill if a test relies on the env.
      BEHAVIORAL_SKILL: ${{ matrix.skill }}
      # Model pin: opus only. The harness also enforces this under CI.
      BEHAVIORAL_MODEL: opus
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install behavioral test dependencies
        run: pip install -r eval/behavioral/requirements.txt

      - name: Run behavioral test for ${{ matrix.skill }} (Linux)
        if: matrix.os == 'Linux'
        working-directory: eval/behavioral
        shell: bash
        run: |
          set -euo pipefail
          test_file="../../skills/${{ matrix.skill }}/evals/evals.py"
          echo "Running $test_file"
          python -m pytest -c pytest.ini -p conftest "$test_file"

      - name: Run behavioral test for ${{ matrix.skill }} (Windows)
        if: matrix.os == 'Windows'
        working-directory: eval/behavioral
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $skill = "${{ matrix.skill }}"
          $test_file = "../../skills/$skill/evals/evals.py"
          Write-Host "Running $test_file"
          python -m pytest -c pytest.ini -p conftest $test_file

  # These skills drive real work on an AMD Instinct GPU, so they can't run on
  # the strix_halo runners above. They get their own job on the self-hosted
  # MI300X runner. Linux-only (ROCm + Docker); no Windows leg.
  #
  # Opt-in: `instinct_run` is true only when the change touches one of the
  # skills AND the PR carries the `enable_mi_ci` label (or the run was
  # dispatched by hand).
  behavioral-instinct:
    name: Behavioral (${{ matrix.skill }} on MI300X)
    needs: discover
    if: needs.discover.outputs.instinct_run == 'true'
    runs-on: [self-hosted, Linux, X64, mi300x, gpu, rocm]
    timeout-minutes: 45
    # Scopes the Anthropic key to this job alone: only jobs that name this
    # environment can read its secrets, unlike a repo-level secret.
    environment: behavioral-instinct
    strategy:
      # One skill failing should not hide the others' results.
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.instinct_skills) }}
    env:
      # The MI300X runner lives outside the AMD network, so it can't reach the
      # internal gateway the strix_halo jobs use. It calls api.anthropic.com
      # directly with its own budgeted key, hence no BASE_URL / CUSTOM_HEADERS.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BEHAVIORAL_SKILL: ${{ matrix.skill }}
      # Model pin: opus only. The harness also enforces this under CI.
      BEHAVIORAL_MODEL: opus
    steps:
      - name: Verify the Anthropic key is available
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY resolved to an empty value. GitHub withholds" >&2
            echo "secrets from pull requests opened from forks; re-run this from" >&2
            echo "a branch in amd/skills, or check that the secret is set on the" >&2
            echo "behavioral-instinct environment." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install behavioral test dependencies
        run: pip install -r eval/behavioral/requirements.txt

      - name: Run behavioral test for ${{ matrix.skill }}
        working-directory: eval/behavioral
        shell: bash
        run: |
          set -euo pipefail
          test_file="../../skills/${{ matrix.skill }}/evals/evals.py"
          echo "Running $test_file"
          python -m pytest -c pytest.ini -p conftest "$test_file"

  # Routing eval: install every skill published in
  # .claude-plugin/marketplace.json at once and check that each prompt in
  # eval/routing/prompts.json activates the skill it should -- and that the
  # prompts which should activate nothing don't. Reports statistics
  # (accuracy, per-skill recall/precision, a confusion matrix) to the job
  # summary; see eval/routing/routing_eval.py.
  #
  # Dispatch-only, and deliberately a single job rather than an OS matrix: a
  # routing decision is made from skill descriptions alone, so it needs no GPU
  # and no second platform. It stays on a self-hosted Linux runner only because
  # that is what can reach the internal LLM gateway.
  routing:
    name: Skill routing (all marketplace skills)
    needs: discover
    if: needs.discover.outputs.run_routing == 'true'
    runs-on: [self-hosted, strix_halo, Linux]
    # Each of the 23 cases is killed as soon as its routing decision is
    # observable, so the run is far shorter than a behavioral one; the cap is
    # here to catch a hung agent.
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ORCHESTR_API_KEY }}
      ANTHROPIC_BASE_URL: https://llm-api.amd.com/Anthropic
      ANTHROPIC_CUSTOM_HEADERS: |
        Ocp-Apim-Subscription-Key: ${{ secrets.ORCHESTR_API_KEY }}
        user: a1_ucicd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # No pip install: the routing runner and the harness it borrows from use
      # only the standard library (pytest is a behavioral-test dependency).
      #
      # The eval reports rather than gates, so a low score shows up as
      # statistics instead of a red run. Add `--min-accuracy 0.9` here to turn
      # it into a hard bar. It still fails on infrastructure problems (no case
      # produced a decision, or no skill activated anywhere).
      - name: Run the skill-routing eval
        shell: bash
        run: |
          set -euo pipefail
          python eval/routing/routing_eval.py \
            --output routing-report.json \
            --keep-logs routing-logs

      - name: Upload routing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-report
          path: |
            routing-report.json
            routing-logs/
          if-no-files-found: warn

  # Single aggregate gate. Mark THIS check required in branch protection.
  #
  #   * nothing testable changed -> pass (neutral).
  #   * testable change          -> pass iff the behavioral job passed.
  #
  # The Instinct leg is only gated on when it was actually requested, so a PR
  # that touches one of those skills without the `enable_mi_ci` label is not
  # blocked by a test it deliberately skipped. The routing leg is gated the
  # same way: it only ever runs on a manual dispatch, so PRs are unaffected.
  behavioral-gate:
    name: behavioral
    needs: [discover, behavioral, behavioral-instinct, routing]
    if: always()
    runs-on: ubuntu-latest
    env:
      DISCOVER_RESULT: ${{ needs.discover.result }}
      BEHAVIORAL_RESULT: ${{ needs.behavioral.result }}
      INSTINCT_RESULT: ${{ needs.behavioral-instinct.result }}
      ROUTING_RESULT: ${{ needs.routing.result }}
      STRIX_ANY: ${{ needs.discover.outputs.strix_any }}
      INSTINCT_AFFECTED: ${{ needs.discover.outputs.instinct }}
      INSTINCT_REQUESTED: ${{ needs.discover.outputs.instinct_run }}
      ROUTING_REQUESTED: ${{ needs.discover.outputs.run_routing }}
      STRIX_SKILLS: ${{ needs.discover.outputs.strix_skills }}
      INSTINCT_SKILLS: ${{ needs.discover.outputs.instinct_skills }}
    steps:
      - name: Verify behavioral results
        run: |
          echo "discover:            $DISCOVER_RESULT"
          echo "behavioral (strix):  $BEHAVIORAL_RESULT"
          echo "behavioral-instinct: $INSTINCT_RESULT"
          echo "routing:             $ROUTING_RESULT"
          echo "strix affected:      $STRIX_ANY ($STRIX_SKILLS)"
          echo "instinct affected:   $INSTINCT_AFFECTED ($INSTINCT_SKILLS)"
          echo "instinct requested:  $INSTINCT_REQUESTED"
          echo "routing requested:   $ROUTING_REQUESTED"

          # If discovery itself failed, surface that rather than guessing.
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "The discover job did not succeed ($DISCOVER_RESULT)." >&2
            exit 1
          fi

          # Touching an Instinct skill without opting in is allowed, but say so
          # loudly: the change went out without ever running on real hardware.
          if [ "$INSTINCT_AFFECTED" = "true" ] && [ "$INSTINCT_REQUESTED" != "true" ]; then
            echo "::warning::This PR changes $INSTINCT_SKILLS but has no" \
                 "'enable_mi_ci' label, so the MI300X behavioral tests did not run."
          fi

          # No skill or behavioral test changed, and no routing run requested:
          # nothing to gate on.
          if [ "$STRIX_ANY" != "true" ] && [ "$INSTINCT_REQUESTED" != "true" ] \
             && [ "$ROUTING_REQUESTED" != "true" ]; then
            echo "No behavioral tests affected by this change."
            exit 0
          fi

          # Each affected leg must have passed. A leg that wasn't triggered is
          # 'skipped', which we ignore.
          failed=0
          if [ "$STRIX_ANY" = "true" ] && [ "$BEHAVIORAL_RESULT" != "success" ]; then
            echo "Strix behavioral tests did not pass ($BEHAVIORAL_RESULT)." >&2
            failed=1
          fi
          if [ "$INSTINCT_REQUESTED" = "true" ] && [ "$INSTINCT_RESULT" != "success" ]; then
            echo "Instinct behavioral test did not pass ($INSTINCT_RESULT)." >&2
            failed=1
          fi
          if [ "$ROUTING_REQUESTED" = "true" ] && [ "$ROUTING_RESULT" != "success" ]; then
            echo "Skill routing eval did not pass ($ROUTING_RESULT)." >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All affected behavioral tests passed."
          exit 0
