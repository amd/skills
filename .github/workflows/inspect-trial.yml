name: inspect-engine trial

# A trial of amd/skillscope#19, which adds a second eval engine built on
# inspect_ai. Nothing here is part of this repository's CI.
#
# Scoped to its own branch: it runs when that branch is pushed and is
# unreachable from main, from any pull request, and from the required checks.
# Deleting the branch deletes the trial. `workflow_dispatch` would not work
# here at all, since that only reaches workflows already on the default branch.
#
# What it is for: the engine has been exercised against one skill in a podman
# container on a laptop, and against fixtures in hosted CI. It has never run on
# this repository's runners, against this catalogue, through this gateway --
# which is the only place the answer that matters can be obtained.

on:
  push:
    branches: [trial/inspect-engine]

permissions:
  contents: read

jobs:
  trial:
    name: Routing on the inspect engine
    runs-on: ["self-hosted", "strix_halo", "Linux"]
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ORCHESTR_API_KEY }}
      ANTHROPIC_BASE_URL: https://llm-api.amd.com/Anthropic
      ANTHROPIC_CUSTOM_HEADERS: |
        Ocp-Apim-Subscription-Key: ${{ secrets.ORCHESTR_API_KEY }}
        user: a1_ucicd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This runner has the Docker CLI but its user cannot reach the socket, so
      # no container can start. Podman is daemonless and rootless and needs
      # neither, which is exactly the gap. Best effort; the next step copes
      # with it not working.
      #
      # Note this mutates a persistent shared runner. On an ephemeral fleet it
      # would belong in the image instead.
      - name: Install podman if it is missing
        continue-on-error: true
        run: |
          # Both, not just podman: it is already installed from an earlier run
          # of this trial, and checking only for it would skip the thing that
          # was actually missing.
          if podman info >/dev/null 2>&1 && podman-compose version >/dev/null 2>&1; then
            echo "podman and podman-compose already usable"
            exit 0
          fi
          # Both from apt: they are system packages every job on this runner
          # would see, which is what a runner image would ship. `podman compose`
          # alone is not enough -- it is a shim that delegates to whichever
          # compose provider it finds, and on this runner that is Docker's
          # plugin, which then talks to the daemon nobody can reach.
          sudo -n apt-get update -qq \
            && sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq podman podman-compose \
            || echo "apt could not install podman and podman-compose; the next step will fall back"

      # `docker compose version` reports the CLI's own version and never
      # contacts the daemon, so it passes on a runner whose user cannot reach
      # the socket. `info` is the question worth asking of either runtime.
      - name: Choose a sandbox
        id: sandbox
        run: |
          # Podman needs a working compose of its own, not just a daemon: the
          # last run had `podman info` succeed and then fail at compose time.
          if podman info >/dev/null 2>&1 && podman-compose version >/dev/null 2>&1; then
            provider=podman
          elif docker info >/dev/null 2>&1; then
            provider=docker
          else
            provider=local
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Behavioral cases will run in: $provider"

      - name: Install the candidate harness
        run: |
          python -m pip install --upgrade pip
          # `[podman]` rather than `[inspect]`: the provider is registered by a
          # separate package, so installing the podman binary is not enough.
          python -m pip install "skillscope[podman] @ git+https://github.com/rominf/skillscope@inspect-engine"

      # Routing is the leg to try first. It offers the skill tool and never
      # calls it, so nothing is executed and no sandbox is started -- whatever
      # the probe above found cannot block it. It is also the cheap leg: one
      # model call per case rather than an agent loop.
      #
      # `--min-accuracy 0` reports instead of gating. A surprise here is
      # information, not a broken branch.
      - name: Routing, whole catalogue
        run: >
          skillscope routing --engine inspect
          --skills-dir 'skills/*'
          --routing-room 'local-ai-use,local-ai-app-integration,serving-llms-on-instinct,tracelens-analysis-orchestrator,hyperloom-workload-optimizer'
          --min-accuracy 0
          --output routing-trial.json

      # The first behavioral run on real infrastructure, and the first time the
      # LLM judge is exercised anywhere but by hand. `lemonade-router-builder`
      # because it needs neither the network nor an accelerator: it generates
      # and validates JSON, so it is the one skill that can run in the default
      # container, which has no network of its own.
      #
      # Runs in whatever the sandbox step found. If that is `local` the agent
      # works directly in the runner's filesystem, as the legacy engine already
      # does, and the report records `sandbox_isolated: false` so no reader has
      # to guess.
      #
      # Continues on error deliberately. This is the leg most likely to find
      # something, and finding something is the point -- a red step here should
      # not hide the routing result above it.
      - name: Behavioral, one hardware-free skill
        continue-on-error: true
        env:
          SKILLSCOPE_SANDBOX: ${{ steps.sandbox.outputs.provider }}
          # Without this, podman picks Docker's compose plugin as its provider
          # and the run dies trying to reach the Docker daemon.
          INSPECT_PODMAN_COMPOSE: podman-compose
        run: >
          skillscope behavioral --engine inspect
          --skills-dir 'skills/*'
          --skill lemonade-router-builder
          --output behavioral-trial.json

      # The reports say which expectations failed; the eval logs say what the
      # agent actually did. Diagnosing the last failure needed the transcript
      # and it had to be inferred from the judge's phrasing instead, so keep
      # both. `.skillscope/logs` is where the inspect engine writes them.
      - name: Keep the reports and the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-trial-reports
          path: |
            routing-trial.json
            behavioral-trial.json
            .skillscope/logs/
          if-no-files-found: warn
