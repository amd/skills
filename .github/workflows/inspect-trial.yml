name: inspect-engine trial

# A trial of amd/skillscope#19, which rebuilds the eval engine on inspect_ai.
# Nothing here is part of this repository's CI.
#
# Scoped to its own branch: it runs when that branch is pushed and is
# unreachable from main, from any pull request, and from the required checks.
# Deleting the branch deletes the trial.
#
# This run is the parity check asked for in review: the whole catalogue,
# routing and behavioral, with the candidate pinned to one commit and the
# released v0.1.3 run beside it on the same runners, the same cases and the
# same flags. v0.1.3 is installed into its own venv and takes no --engine;
# its only engine is the one the candidate replaces. Every invocation's wall
# time goes into a timings TSV in each job's artifact. Three jobs
# because three runner pools, and they overlap in wall clock.
#
#   linux    strix_halo, Linux    routing (whole catalogue) + 3 engines
#   instinct mi300x               the two skills that need an Instinct card
#   windows  strix_halo, Windows  the claim this whole design rests on
#
# The Windows job is the one that matters most. `inspect_swe` installs a Linux
# proxy binary in the guest and cannot run on Windows at all, so
# `claude-code-no-sandbox`
# -- the real CLI driven from the host under inspect_ai -- is the only way real
# Claude Code reaches a Windows runner. That has been verified by hand on a
# laptop and never in CI.

on:
  push:
    branches: [trial/inspect-engine]

permissions:
  contents: read

env:
  # The two builds being compared. The candidate is pinned by commit, and
  # check_harness.py refuses to run if a different one installed.
  CANDIDATE: ff33db4
  SKILLSCOPE_EXPECTED_COMMIT: ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5
  BASELINE: v0.1.3
  BASELINE_SPEC: "skillscope @ git+https://github.com/amd/skillscope@v0.1.3"
  # What the baseline grades: main's own catalogue at this commit, checked
  # out beside this one and graded from inside it, the way main's CI runs
  # v0.1.3 today. This branch's skills are that catalogue plus the sandbox
  # declarations the candidate needs -- which v0.1.3's structural check
  # rejects as unknown keys, so it cannot grade this branch's copy.
  BASELINE_CATALOGUE: de0d03ae90b37a4f5ef38e0cf26ef6e3d3af7e94
  # NOT set workflow-wide. The Instinct pool sits outside the network this
  # host is on and cannot reach it; inheriting it there is what made four
  # runs hang until their 300-minute timeout. Each job that can reach the
  # gateway sets it for itself.
  #
  # Every skill with a dataset. The room is the whole catalogue on purpose:
  # routing pools each skill's prompts as its neighbours' negatives, so a skill
  # left out of the room is a set of negatives nobody is asserting. Earlier
  # runs used a room of five and reported 46/46 as though it covered the repo.
  ROUTING_ROOM: >-
    hyperloom-workload-optimizer,lemonade-router-builder,local-ai-app-integration,local-ai-use,magpie-kernel-evaluator,quark-install,quark-torch-llm-ptq,serving-llms-on-epyc,serving-llms-on-instinct,tracelens-analysis-orchestrator

jobs:
  # Which pools this push should exercise. A push re-runs every enabled job,
  # and the Linux leg alone is an hour of real model spend -- so when a fix
  # concerns one pool, turn the others off rather than paying again for
  # results already in hand. Edit these three values.
  config:
    name: Which pools to run
    runs-on: ubuntu-latest
    outputs:
      linux: "true"
      instinct: "false"
      windows: "false"
      # Diagnose and grade are mutually exclusive: the behavioral step is
      # gated on `instinct_diagnose != 'true'`, so leaving this on skips the
      # graded run rather than adding context to it. Diagnose answers whether
      # the container starts, sees the card and reaches the network -- which
      # run 36526038473 confirmed, along with the federation exchange -- and
      # then it goes off so the grading can happen.
      instinct_diagnose: "false"
      # Two Windows failures have each survived a fix aimed at a theory. This
      # run measures instead, and spends nothing on the model.
      windows_diagnose: "false"
      # Deliberately unsandboxed. Only ever `true` when measuring the host is
      # the point -- never to get past a broken container runtime, which is
      # exactly the failure the probes now refuse to hide.
      allow_unsandboxed: "false"
      # Behavioral has completed results for both remaining engines, under
      # their former names. The rename and the guards did not change what the
      # agent does, so re-running buys a second copy of numbers already in
      # hand at an hour of model spend. Turn it on when the behavioral path
      # itself changes.
      behavioral: "false"
      # On. The repair worked -- run 35886543177 resolved to podman, the first
      # Linux run to do so since 2026-09-15 -- so there is a real container to
      # measure in for the first time. Four passes over the whole room: the
      # two legs, plus a second pass on the baseline for the noise floor, without
      # which the flips between engines cannot be read.
      routing: "true"
      # Which routing legs to run, and whether to repeat the baseline and the
      # noise-floor pass. Run 37278784395 measured all four, but the
      # sandboxed leg ran out of the default 900s --timeout at 58 of 77 cases:
      # it starts a container per case. This push re-runs that leg alone.
      routing_engines: "claude-code"
      routing_baselines: "false"
      # Which engines the Linux job drives. The harness-independent `inspect`
      # engine has been removed, and `claude-cli` is now
      # `claude-code-no-sandbox`. Both remaining engines drive the real CLI;
      # what differs is where it runs.
      linux_engines: "claude-code claude-code-no-sandbox"
    steps:
      - run: echo "parity run -- every pool, candidate ${{ env.CANDIDATE }} against ${{ env.BASELINE }}"

  # ---------------------------------------------------------------- Linux ---
  linux:
    name: Whole catalogue, three engines
    needs: config
    if: needs.config.outputs.linux == 'true'
    runs-on: ["self-hosted", "strix_halo", "Linux"]
    # Per-skill invocations and a fourth build make this the longest job.
    timeout-minutes: 300
    env:
      ANTHROPIC_BASE_URL: https://llm-api.amd.com/Anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ORCHESTR_API_KEY }}
      ANTHROPIC_CUSTOM_HEADERS: |
        Ocp-Apim-Subscription-Key: ${{ secrets.ORCHESTR_API_KEY }}
        user: a1_ucicd
      # Everything that does not declare mi300x. `magpie-kernel-evaluator` is
      # GPU work that declares no machine.yml at all, so it runs here by
      # default rather than by intent -- keep an eye on what it reports.
      #
      # All six, not one. The behavioral table quotes six skills and the trial
      # had been grading `local-ai-use` alone, so five of those rows were
      # months old and predated both the --effort and the missing-files fixes.
      # 13 behavioral cases; the point is to refresh the table in one pass.
      # Space-separated: the loops below split on whitespace. Commas made
      # every "per-skill" loop a single invocation over all six.
      SKILLS: lemonade-router-builder local-ai-app-integration local-ai-use magpie-kernel-evaluator quark-install quark-torch-llm-ptq serving-llms-on-epyc tracelens-analysis-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This runner has the Docker CLI but its user cannot reach the socket, so
      # no container can start. Podman is daemonless and rootless and needs
      # neither. Best effort; the sandbox probe copes with it not working.
      #
      # Note this mutates a persistent shared runner. On an ephemeral fleet it
      # would belong in the image.
      - name: Install podman if it is missing
        continue-on-error: true
        run: |
          if podman info >/dev/null 2>&1 && podman-compose version >/dev/null 2>&1; then
            echo "podman and podman-compose already usable"; exit 0
          fi
          sudo -n apt-get update -qq \
            && sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq podman podman-compose \
            || echo "apt could not install podman and podman-compose"

      # Installing podman is not the same as podman working, and on this
      # runner it has not been since 2026-09-15. What it reports is:
      #
      #   invalid internal status, try resetting the pause process with
      #   "podman system migrate": could not find any running process
      #
      # Rootless podman keeps a pause process that owns its user namespace.
      # The runner's session does not linger, so when the session that started
      # that process ends, podman is left pointing at a pid that is gone and
      # every command fails -- while `podman` itself is installed and on PATH,
      # which is why "install podman" looked like it had worked for six weeks.
      #
      # `podman system migrate` is podman's own prescribed remedy: it resets
      # the namespace and the pause process. Cheap, idempotent, and it needs no
      # privileges. Lingering is the durable fix and is attempted too, so that
      # a later job on this runner may not need the repair at all -- but it is
      # best-effort, because it is the kind of thing a host owner may have
      # deliberately turned off.
      - name: Repair podman if it is installed but broken
        continue-on-error: true
        run: |
          if podman info >/dev/null 2>&1; then
            echo "podman already healthy; nothing to repair"; exit 0
          fi
          echo "podman is installed but not usable. What it says:"
          podman info 2>&1 | tail -5 || true

          echo "--- podman system migrate ---"
          podman system migrate 2>&1 | tail -5 || true

          # Durable, so the next job may find it already working. Best-effort:
          # a host owner may have disabled lingering on purpose.
          sudo -n loginctl enable-linger "$(id -u)" 2>&1 | tail -2 \
            || echo "could not enable lingering (not fatal; migrate is per-run)"

          if podman info >/dev/null 2>&1; then
            echo "podman is usable after the repair"
          else
            echo "still not usable after the repair. Remaining error:"
            podman info 2>&1 | tail -5 || true
          fi

      # Docker assumes Docker Hub for a short image name; podman refuses to
      # guess, and inspect's default compose names its image without one.
      - name: Give podman a registry to search
        continue-on-error: true
        run: |
          conf=/etc/containers/registries.conf
          if sudo -n test -f "$conf" && sudo -n grep -q "^unqualified-search-registries" "$conf"; then
            echo "already configured"
          else
            echo 'unqualified-search-registries = ["docker.io"]' \
              | sudo -n tee -a "$conf" >/dev/null || echo "could not write $conf"
          fi

      # `docker compose version` reports the CLI's own version and never
      # contacts the daemon, so it passes on a runner whose user cannot reach
      # the socket. `info` is the question worth asking of either runtime.
      # Falling through to `local` is what this used to do, and it cost six
      # weeks of results: from 2026-09-15 onwards the Linux runner's podman
      # stopped working, the probe silently chose `local`, and every
      # `claude-code` leg since ran on the host filesystem while the reports
      # described a sandboxed engine. Nobody saw it, because nothing said so.
      #
      # It says so now. `local` is still reachable, but only by asking: a run
      # that wanted a container and did not get one stops here, where the
      # reason is one line, rather than producing numbers whose meaning is the
      # opposite of what they claim.
      - name: Choose a sandbox
        id: sandbox
        env:
          ALLOW_UNSANDBOXED: ${{ needs.config.outputs.allow_unsandboxed }}
        run: |
          if podman info >/dev/null 2>&1 && podman-compose version >/dev/null 2>&1; then
            provider=podman
          elif docker info >/dev/null 2>&1; then
            provider=docker
          elif [ "$ALLOW_UNSANDBOXED" = "true" ]; then
            provider=local
            echo "::warning::No container runtime here, and allow_unsandboxed is set," \
                 "so this runs on the host filesystem. No leg in these results is" \
                 "sandboxed, whatever it calls itself."
          else
            echo "::error::No usable container runtime on this runner. podman info," \
                 "podman-compose version and docker info all failed. Refusing to fall" \
                 "through to the host: a claude-code leg would run unsandboxed and the" \
                 "report would not say so. Fix the runtime, or set allow_unsandboxed to" \
                 "true in the config job to measure the host deliberately."
            podman info 2>&1 | tail -3 || true
            docker info 2>&1 | tail -3 || true
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Behavioral cases will run in: $provider"

      - name: Install the candidate harness
        run: |
          python -m pip install --upgrade pip
          # Two steps, because a branch that does not bump its version defeats
          # both of pip's usual escapes: the VCS URL does not change when the
          # branch moves, and `--upgrade` sees the same version already
          # installed and calls it satisfied.
          python -m pip install --no-cache-dir \
            "skillscope[podman,verify] @ git+https://github.com/rominf/skillscope@ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5"
          python -m pip install --force-reinstall --no-deps --no-cache-dir \
            "skillscope @ git+https://github.com/rominf/skillscope@ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5"

      # Assume nothing about which build arrived: name something only the
      # current one has, and fail loudly rather than trialling last week's.
      - name: Check which harness actually installed
        # Shared with the Windows job. Two copies drifted apart once and the
        # stale one failed a run on hardware that is slow to book.
        run: python .github/scripts/check_harness.py

      # The baseline, in a venv of its own so neither build can shadow the
      # other's entry point. Called by path below, never as bare `skillscope`.
      - name: Install the baseline harness (${{ env.BASELINE }})
        run: |
          python -m venv .baseline
          .baseline/bin/python -m pip install --upgrade pip
          .baseline/bin/python -m pip install --no-cache-dir "$BASELINE_SPEC"
          .baseline/bin/python -m pip show skillscope | head -2
          .baseline/bin/skillscope --help > /dev/null
          git fetch --no-tags --depth 1 origin "$BASELINE_CATALOGUE"
          # These runners persist. Checkout deletes the last run's tree but
          # not git's record of it, and `add` refuses a registered path.
          git worktree prune
          git worktree add --detach baseline-tree FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # Routing has a leg on every engine, which is the point of this
      # re-run. `claude-code-no-sandbox` is the baseline now -- it replaced
      # `legacy` on measured parity, and is what every other number is
      # compared against; `claude-code` is the only leg whose room is
      # guaranteed to hold
      # exactly the skills asked for, because its guest has no `~/.claude` to
      # contribute; `claude-code-no-sandbox` is what Windows gets, and it
      # refuses to start without ANTHROPIC_API_KEY because that credential is
      # what lets it redirect the config dir.
      #
      # `--min-accuracy 0` reports instead of gating: a surprise here is
      # information, not a broken branch.
      - name: Routing, whole catalogue, every leg
        if: needs.config.outputs.routing == 'true'
        continue-on-error: true
        env:
          PROBED: ${{ steps.sandbox.outputs.provider }}
          # Without this, inspect calls bare `podman compose`, which is a shim
          # that delegates to whichever compose provider it finds -- on a host
          # that also has Docker, that is Docker's, and Docker's socket is
          # permission-denied here. The symptom is "No services started for
          # podman sandbox" and every case erroring, which is what the first
          # sandboxed routing run produced. The behavioral step has always set
          # it; this one was written without it.
          INSPECT_PODMAN_COMPOSE: podman-compose
          TIMING_JOB: linux
        run: |
          # Wall time per invocation, for the per-skill, per-engine table.
          timed() {  # label engine skill -- command...
            local label=$1 engine=$2 skill=$3 t0=$SECONDS rc=0; shift 4
            "$@" || rc=$?
            printf '%s\t%s\t%s\t%s\t%s\n' "$label" "$engine" "$skill" \
              "$((SECONDS - t0))" "$rc" >> "timings-$TIMING_JOB.tsv"
            return $rc
          }
          # The baseline grades main's catalogue from inside it.
          in_baseline() { (cd baseline-tree && "$@"); }
          status=0
          for engine in ${{ needs.config.outputs.routing_engines }}; do
            if [ "$engine" = "claude-code" ]; then
              export SKILLSCOPE_SANDBOX="$PROBED"
            else
              export SKILLSCOPE_SANDBOX=local
            fi
            echo "::group::routing ($engine, sandbox=$SKILLSCOPE_SANDBOX)"
            timed routing "$engine" all -- skillscope routing --engine "$engine" \
              --skills-dir 'skills/*' \
              --routing-room '${{ env.ROUTING_ROOM }}' \
              --min-accuracy 0 --timeout 3600 \
              --output "routing-$engine.json" \
              || { echo "FAILED: routing ($engine)"; status=1; }
            echo "::endgroup::"
          done
          # A second pass on the baseline, so the flips between engines can be
          # read against how much one engine already disagrees with itself.
          # Without it the comparison cannot be interpreted at all. The
          # baseline used to be `legacy`; it is now the engine that replaced
          # it, which is the one every other number is compared against.
          if [ "${{ needs.config.outputs.routing_baselines }}" = "true" ]; then
          export SKILLSCOPE_SANDBOX=local
          echo "::group::routing (claude-code-no-sandbox, noise floor)"
          timed routing claude-code-no-sandbox-again all -- \
            skillscope routing --engine claude-code-no-sandbox \
            --skills-dir 'skills/*' \
            --routing-room '${{ env.ROUTING_ROOM }}' \
            --min-accuracy 0 \
            --output routing-claude-code-no-sandbox-again.json || status=1
          echo "::endgroup::"

          # The baseline: same room, same cases, same flags, on the host as it
          # has always run. No --engine; v0.1.3 has one.
          echo "::group::routing ($BASELINE)"
          timed routing "$BASELINE" all -- in_baseline ../.baseline/bin/skillscope routing \
            --skills-dir 'skills/*' \
            --routing-room '${{ env.ROUTING_ROOM }}' \
            --min-accuracy 0 \
            --output "../routing-$BASELINE.json" \
            || { echo "FAILED: routing ($BASELINE)"; status=1; }
          echo "::endgroup::"
          fi

          # `continue-on-error` above keeps one bad leg from discarding the
          # other two, but it also means GitHub marks this step green whatever
          # happened, and a leg that produced no report at all is then visible
          # only to whoever reads the log. That is how a run went green having
          # never measured the sandboxed leg: it died on a TypeError, printed
          # FAILED, and nothing downstream noticed the missing file.
          #
          # So say it where the run page shows it. Still not fatal -- this is a
          # trial, and a routing regression is the finding rather than a build
          # break -- but no longer silent.
          missing=""
          for engine in ${{ needs.config.outputs.routing_engines }}; do
            [ -s "routing-$engine.json" ] || missing="$missing $engine"
          done
          if [ -n "$missing" ] || [ "$status" -ne 0 ]; then
            {
              echo "### :warning: routing did not measure every leg"
              echo
              [ -n "$missing" ] && echo "No report produced for:\`$missing\`"
              echo
              echo "Any leg-to-leg comparison from this run is incomplete."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # One invocation per skill: running six in one command meant the last one
      # dying discarded the reports for the five that had already passed.
      #
      # `claude-code-no-sandbox` runs on the host by construction, so it takes `local`
      # while the other two take whatever the probe found. 2700s because
      # tracelens needs 850s on Windows and 480-600s here, against a 900s
      # default that three legs have already died on.
      - name: Behavioral
        if: needs.config.outputs.behavioral == 'true'
        continue-on-error: true
        env:
          PROBED: ${{ steps.sandbox.outputs.provider }}
          ENGINES: ${{ needs.config.outputs.linux_engines }}
          INSPECT_PODMAN_COMPOSE: podman-compose
          TIMING_JOB: linux
        run: |
          # Wall time per invocation, for the per-skill, per-engine table.
          timed() {  # label engine skill -- command...
            local label=$1 engine=$2 skill=$3 t0=$SECONDS rc=0; shift 4
            "$@" || rc=$?
            printf '%s\t%s\t%s\t%s\t%s\n' "$label" "$engine" "$skill" \
              "$((SECONDS - t0))" "$rc" >> "timings-$TIMING_JOB.tsv"
            return $rc
          }
          # The baseline grades main's catalogue from inside it.
          in_baseline() { (cd baseline-tree && "$@"); }
          status=0
          for engine in $ENGINES; do
            if [ "$engine" = "claude-code-no-sandbox" ]; then
              export SKILLSCOPE_SANDBOX=local
            else
              export SKILLSCOPE_SANDBOX="$PROBED"
            fi
            for skill in $SKILLS; do
              echo "::group::$skill ($engine, sandbox=$SKILLSCOPE_SANDBOX)"
              timed behavioral "$engine" "$skill" -- \
                skillscope behavioral --engine "$engine" --skills-dir 'skills/*' \
                --timeout 2700 --skill "$skill" \
                --output "linux-$engine-$skill.json" \
                || { echo "FAILED: $skill ($engine)"; status=1; }
              echo "::endgroup::"
            done
          done
          export SKILLSCOPE_SANDBOX=local
          for skill in $SKILLS; do
            echo "::group::$skill ($BASELINE)"
            timed behavioral "$BASELINE" "$skill" -- \
              in_baseline ../.baseline/bin/skillscope behavioral --skills-dir 'skills/*' \
              --timeout 2700 --skill "$skill" \
              --output "../linux-$BASELINE-$skill.json" \
              || { echo "FAILED: $skill ($BASELINE)"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Keep the reports and the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-linux
          path: |
            routing-*.json
            linux-*.json
            timings-*.tsv
            .skillscope/logs/
            baseline-tree/.skillscope/
          # `.skillscope/logs` starts with a dot, and v4 skips hidden files
          # unless told otherwise. The transcripts were dropped on every run
          # before this was set, which is what the step exists to keep.
          include-hidden-files: true
          if-no-files-found: warn

  # ------------------------------------------------------------- Instinct ---
  instinct:
    name: The two skills that need an Instinct card
    needs: config
    if: needs.config.outputs.instinct == 'true'
    # The labels `evals.yml` uses for this pool. An earlier version of this
    # job asked for ["self-hosted", "mi300x", "gpu", "rocm"], which is not the
    # set the pool advertises.
    runs-on: ["self-hosted", "Linux", "X64"]
    timeout-minutes: 300
    # Where this pool's Anthropic access lives. It holds no API key: the four
    # federation IDs below are not secrets, and the job trades a GitHub OIDC
    # token for a short-lived Anthropic one.
    environment: behavioral-instinct
    permissions:
      contents: read
      # Required to request the OIDC token. Without it `credentials.py` gets
      # no ACTIONS_ID_TOKEN_REQUEST_URL and the exchange cannot start.
      id-token: write
    env:
      # On the job, not the minting step, because the behavioral loop re-mints
      # between skills. Identifiers, not secrets.
      FEDERATION_RULE_ID: fdrl_014u39zsJmsex5SkL1gWg7qo
      FEDERATION_ORGANIZATION_ID: 9bdff596-1595-4140-8301-817e43ef8412
      FEDERATION_SERVICE_ACCOUNT_ID: svac_016zcTqZ4XkFdjAJCag9jQC9
      FEDERATION_WORKSPACE_ID: wrkspc_01EUPtU7mqFtoQowMAREPvoq
      # Deliberately no ANTHROPIC_BASE_URL, no key, no gateway headers. This
      # pool is off the network the gateway is on and talks straight to
      # api.anthropic.com. Four runs hung here for the full 300 minutes
      # because the job inherited a workflow-level base URL it had no route
      # to -- and `evals.yml` says so in as many words: "The gateway runners
      # above can't [use OIDC], since those tokens only work with
      # api.anthropic.com."
      SKILLS: hyperloom-workload-optimizer serving-llms-on-instinct
      ENGINES: claude-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Falling through to `local` is what this used to do, and it cost six
      # weeks of results: from 2026-09-15 onwards the Linux runner's podman
      # stopped working, the probe silently chose `local`, and every
      # `claude-code` leg since ran on the host filesystem while the reports
      # described a sandboxed engine. Nobody saw it, because nothing said so.
      #
      # It says so now. `local` is still reachable, but only by asking: a run
      # that wanted a container and did not get one stops here, where the
      # reason is one line, rather than producing numbers whose meaning is the
      # opposite of what they claim.
      - name: Choose a sandbox
        id: sandbox
        env:
          ALLOW_UNSANDBOXED: ${{ needs.config.outputs.allow_unsandboxed }}
        run: |
          if podman info >/dev/null 2>&1 && podman-compose version >/dev/null 2>&1; then
            provider=podman
          elif docker info >/dev/null 2>&1; then
            provider=docker
          elif [ "$ALLOW_UNSANDBOXED" = "true" ]; then
            provider=local
            echo "::warning::No container runtime here, and allow_unsandboxed is set," \
                 "so this runs on the host filesystem. No leg in these results is" \
                 "sandboxed, whatever it calls itself."
          else
            echo "::error::No usable container runtime on this runner. podman info," \
                 "podman-compose version and docker info all failed. Refusing to fall" \
                 "through to the host: a claude-code leg would run unsandboxed and the" \
                 "report would not say so. Fix the runtime, or set allow_unsandboxed to" \
                 "true in the config job to measure the host deliberately."
            podman info 2>&1 | tail -3 || true
            docker info 2>&1 | tail -3 || true
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Behavioral cases will run in: $provider"

      - name: Install the candidate harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            "skillscope[podman,verify] @ git+https://github.com/rominf/skillscope@ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5"
          python -m pip install --force-reinstall --no-deps --no-cache-dir \
            "skillscope @ git+https://github.com/rominf/skillscope@ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5"

      - name: Check which harness actually installed
        run: python .github/scripts/check_harness.py

      - name: Install the baseline harness (${{ env.BASELINE }})
        run: |
          python -m venv .baseline
          .baseline/bin/python -m pip install --upgrade pip
          .baseline/bin/python -m pip install --no-cache-dir "$BASELINE_SPEC"
          .baseline/bin/python -m pip show skillscope | head -2
          .baseline/bin/skillscope --help > /dev/null
          git fetch --no-tags --depth 1 origin "$BASELINE_CATALOGUE"
          # These runners persist. Checkout deletes the last run's tree but
          # not git's record of it, and `add` refuses a registered path.
          git worktree prune
          git worktree add --detach baseline-tree FETCH_HEAD
      # The same exchange `skill-evals.yml` performs for this pool. Run here
      # rather than through the reusable workflow because this trial drives a
      # candidate harness, and placed after the install because it uses that
      # harness's own `credentials.py`. Writes ANTHROPIC_AUTH_TOKEN into
      # GITHUB_ENV. The four IDs are copied from evals.yml and are
      # identifiers, not secrets.
      - name: Trade the OIDC token for an Anthropic one
        run: python -m skillscope.credentials

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # Only the containerized engine runs here. `claude-code-no-sandbox` executes on
      # the host by construction, and this is shared GPU infrastructure rather
      # than a desktop -- its host-side path is already proven on strix_halo,
      # so repeating it here buys little against what it risks.
      - name: Does this sandbox have a card and a network?
        if: needs.config.outputs.instinct_diagnose == 'true'
        run: python .github/scripts/instinct_diag.py

      - name: Behavioral -- claude-code
        if: needs.config.outputs.instinct_diagnose != 'true'
        continue-on-error: true
        env:
          SKILLSCOPE_SANDBOX: ${{ steps.sandbox.outputs.provider }}
          INSPECT_PODMAN_COMPOSE: podman-compose
          TIMING_JOB: instinct
        run: |
          # The token this pool runs on lasts about twelve and a half minutes,
          # and it is minted once at job start. A run that graded for longer
          # than that died mid-case with `401 OAuth access token has expired`
          # -- forty-eight times, twenty minutes in, on hardware that is slow
          # to book. So mint a fresh one before each skill.
          #
          # Read back rather than left to $GITHUB_ENV: that file is applied
          # between steps, and this is inside one. The delimiter is the
          # writer's own.
          # Wall time per invocation, for the per-skill, per-engine table.
          timed() {  # label engine skill -- command...
            local label=$1 engine=$2 skill=$3 t0=$SECONDS rc=0; shift 4
            "$@" || rc=$?
            printf '%s\t%s\t%s\t%s\t%s\n' "$label" "$engine" "$skill" \
              "$((SECONDS - t0))" "$rc" >> "timings-$TIMING_JOB.tsv"
            return $rc
          }
          # The baseline grades main's catalogue from inside it.
          in_baseline() { (cd baseline-tree && "$@"); }
          mint() {
            local scratch
            scratch=$(mktemp)
            if ! GITHUB_ENV="$scratch" python -m skillscope.credentials; then
              rm -f "$scratch"; return 1
            fi
            ANTHROPIC_AUTH_TOKEN=$(
              awk '/^ANTHROPIC_AUTH_TOKEN<</{getline; print; exit}' "$scratch"
            )
            export ANTHROPIC_AUTH_TOKEN
            rm -f "$scratch"
            [ -n "$ANTHROPIC_AUTH_TOKEN" ]
          }

          status=0
          for engine in $ENGINES; do
            for skill in $SKILLS; do
              echo "::group::$skill ($engine)"
              mint || { echo "FAILED: could not mint a token for $skill"; status=1; }
              timed behavioral "$engine" "$skill" -- \
                skillscope behavioral --engine "$engine" --skills-dir 'skills/*' \
                --timeout 3600 --skill "$skill" \
                --output "instinct-$engine-$skill.json" \
                || { echo "FAILED: $skill ($engine)"; status=1; }
              echo "::endgroup::"
            done
          done
          # The baseline runs on this host, as v0.1.3 always has here: it has
          # no container to put the card in.
          export SKILLSCOPE_SANDBOX=local
          for skill in $SKILLS; do
            echo "::group::$skill ($BASELINE)"
            mint || { echo "FAILED: could not mint a token for $skill"; status=1; }
            timed behavioral "$BASELINE" "$skill" -- \
              in_baseline ../.baseline/bin/skillscope behavioral --skills-dir 'skills/*' \
              --timeout 3600 --skill "$skill" \
              --output "../instinct-$BASELINE-$skill.json" \
              || { echo "FAILED: $skill ($BASELINE)"; status=1; }
            echo "::endgroup::"
          done

          # `continue-on-error` below keeps one bad skill from discarding the
          # rest, but it also means GitHub marks this step green whatever
          # happened. That is how a run went green having graded two cases 4/4
          # and then crashed writing the report: the only trace was a missing
          # file nothing looked for, on hardware that is scarce and slow to
          # book. Say it where the run page shows it.
          missing=""
          for engine in $ENGINES "$BASELINE"; do
            for skill in $SKILLS; do
              [ -s "instinct-$engine-$skill.json" ] \
                || missing="$missing $skill($engine)"
            done
          done
          if [ -n "$missing" ] || [ "$status" -ne 0 ]; then
            {
              echo "### :warning: Instinct produced no report for:\`$missing\`"
              echo
              echo "Cases may still have been graded -- check the .eval log in"
              echo "the artifact before concluding the run measured nothing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Keep the reports and the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-instinct
          path: |
            instinct-*.json
            timings-*.tsv
            .skillscope/logs/
            baseline-tree/.skillscope/
          include-hidden-files: true
          if-no-files-found: warn

  # -------------------------------------------------------------- Windows ---
  windows:
    name: Real Claude Code on Windows
    needs: config
    if: needs.config.outputs.windows == 'true'
    runs-on: ["self-hosted", "strix_halo", "Windows"]
    # Twelve invocations now, up from nine; tracelens alone is ~850s here.
    timeout-minutes: 300
    env:
      ANTHROPIC_BASE_URL: https://llm-api.amd.com/Anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ORCHESTR_API_KEY }}
      ANTHROPIC_CUSTOM_HEADERS: |
        Ocp-Apim-Subscription-Key: ${{ secrets.ORCHESTR_API_KEY }}
        user: a1_ucicd
      # Unsandboxed by construction: the CLI runs on the host, so the sandbox
      # is the host. That is what the legacy engine already does on Windows
      # today, so it is not a regression -- and the report records
      # `sandbox_isolated: false` rather than leaving a reader to assume.
      SKILLSCOPE_SANDBOX: local
      # The harness drops inspect's live sample buffer on Windows, because its
      # path is derived from the task name under the service account's profile
      # and a longer skill crosses MAX_PATH. Setting LOCALAPPDATA short does
      # not help -- platformdirs asks Windows, not the environment.
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install the candidate harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "skillscope[inspect] @ git+https://github.com/rominf/skillscope@ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5"
          python -m pip install --force-reinstall --no-deps --no-cache-dir "skillscope @ git+https://github.com/rominf/skillscope@ff33db4f5e94bdf4cccdecfe7068af8c5e7fedb5"

      # Three skills failed in under a second on the first attempt because the
      # harness installed without its extra, and `continue-on-error` on the leg
      # below reported that as success. Check the import before spending
      # anything.
      - name: Check the harness can actually run
        # A file, not `python -c`. PowerShell has no heredoc, so this lived on
        # one line -- and an f-string's braces read to PowerShell as a
        # ScriptBlock, which cost a run on this pool to discover.
        run: python .github/scripts/check_harness.py

      - name: Install the baseline harness (${{ env.BASELINE }})
        run: |
          python -m venv .baseline
          .baseline\Scripts\python.exe -m pip install --upgrade pip
          .baseline\Scripts\python.exe -m pip install --no-cache-dir "$env:BASELINE_SPEC"
          .baseline\Scripts\python.exe -m pip show skillscope | Select-Object -First 2
          .baseline\Scripts\skillscope.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git fetch --no-tags --depth 1 origin $env:BASELINE_CATALOGUE
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Persistent runner: see the Linux job.
          git worktree prune
          git worktree add --detach baseline-tree FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: What does this runner actually have?
        if: needs.config.outputs.windows_diagnose == 'true'
        run: python .github/scripts/win_diag.py

      # Three repetitions of the same set, because one run of a
      # nondeterministic agent measures nothing. The same engine scored
      # `lemonade-router-builder` 21/21 and then 15/21 on this machine with no
      # change in between, so no per-skill Windows number is quotable until the
      # spread across repeats is known. That spread is the noise floor, and it
      # is what tells a real platform difference from ordinary variance.
      #
      # Repetition-major rather than skill-major: if the job is cut short, two
      # complete rounds across every skill beats three rounds of the first two
      # and none of the third.
      # Twice per build, interleaved, so a difference between the two can be
      # read against how much each already disagrees with itself.
      - name: Behavioral -- claude-code-no-sandbox and ${{ env.BASELINE }}, twice each
        if: needs.config.outputs.windows_diagnose != 'true'
        continue-on-error: true
        run: |
          $skills = @(
            "lemonade-router-builder",
            "local-ai-use",
            "tracelens-analysis-orchestrator"
          )
          $builds = @(
            @{ Name = "claude-code-no-sandbox"; Exe = "skillscope"; Args = @("--engine", "claude-code-no-sandbox"); Dir = "."; Out = "" },
            # The baseline grades main's catalogue from inside it.
            @{ Name = $env:BASELINE; Exe = "..\.baseline\Scripts\skillscope.exe"; Args = @(); Dir = "baseline-tree"; Out = "..\" }
          )
          $status = 0
          foreach ($run in 1..2) {
            foreach ($s in $skills) {
              foreach ($b in $builds) {
                $name = $b.Name
                Write-Host "::group::$s ($name on Windows, run $run)"
                $t0 = Get-Date
                Push-Location $b.Dir
                & $b.Exe behavioral @($b.Args) --skills-dir "skills/*" `
                  --timeout 2700 --skill $s --output "$($b.Out)windows-$name-$s-run$run.json"
                $rc = $LASTEXITCODE
                Pop-Location
                $secs = [int]((Get-Date) - $t0).TotalSeconds
                "behavioral`t$name`t$s`t$secs`t$rc" | Add-Content -Path "timings-windows.tsv"
                if ($rc -ne 0) { Write-Host "FAILED: $s ($name, run $run)"; $status = 1 }
                Write-Host "::endgroup::"
              }
            }
          }
          exit $status

      - name: What did the run leave behind?
        if: always()
        run: |
          Write-Host "cwd: $(Get-Location)"
          if (Test-Path ".skillscope") {
            Get-ChildItem -Recurse -Force ".skillscope" | Select-Object -First 40 FullName, Length
          } else {
            Write-Host "no .skillscope directory -- inspect wrote its logs somewhere else"
            Get-ChildItem -Recurse -Force -Filter "*.eval" . -ErrorAction SilentlyContinue |
              Select-Object -First 20 FullName
          }

      - name: Keep the reports and the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-windows
          path: |
            windows-*.json
            timings-*.tsv
            .skillscope/logs/
            baseline-tree/.skillscope/
          include-hidden-files: true
          if-no-files-found: warn
