# This skill's behavioral cases install a local AI runtime and fetch models, so
# they cannot run in the default sandbox, which has no network of its own. The
# compose file beside this one gives the container egress.
#
# Requires a skillscope that understands `sandbox:` (amd/skillscope#19). Older
# releases reject the key outright, so this cannot merge ahead of that.
os: [Linux]
sandbox: compose.yaml
