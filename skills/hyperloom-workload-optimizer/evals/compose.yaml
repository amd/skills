# These cases need two things the default sandbox withholds: the Instinct card
# itself, and the network to fetch a model before anything can be served.
#
# Without this file both ran in inspect's default container -- no egress, no
# devices -- and spent forty-five minutes retrying before the timeout killed
# them. That reads as the skill hanging rather than the sandbox being wrong
# for it, which is why the declaration belongs here next to machine.yml.
#
# Image fully qualified: podman will not guess a registry.
services:
  default:
    image: docker.io/aisiuk/inspect-tool-support
    command: tail -f /dev/null
    init: true
    stop_grace_period: 1s
    # ROCm reaches the card through these two nodes.
    devices:
      - /dev/kfd
      - /dev/dri
    # No `group_add`. Naming `video` and `render` is the usual advice, and it
    # stopped the container from starting at all here -- "unable to find group
    # render: no matching entries in group file" -- which cost four timed-out
    # runs before anyone looked. The container runs as root, which reaches both
    # device nodes without belonging to either group; a host that needs the
    # groups can add them by numeric gid, which exists everywhere the names do
    # not.
    security_opt:
      - seccomp=unconfined
    ipc: host
