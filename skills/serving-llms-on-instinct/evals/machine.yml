# Runner requirements for this skill's behavior cases.
# See eval/schema/machine.schema.json.

runner: [self-hosted, Linux, X64, mi300x, gpu, rocm]
os: [Linux]

# The MI300X runner is a scarce shared resource, so touching this skill is
# necessary but not sufficient: a maintainer opts the PR in with this label.
# Without it CI warns instead of failing, so a PR is never blocked by a test it
# deliberately skipped.
gate: enable_mi_ci

# Scopes the Anthropic key to this job alone. The MI300X runner sits outside
# the AMD network and cannot reach the internal gateway the default runners
# use, so it calls api.anthropic.com directly with its own budgeted key.
environment: behavioral-instinct

reason: >-
  serve-tiny-model-on-instinct launches a real vLLM container on an AMD
  Instinct GPU and polls the endpoint until it is healthy, so it needs ROCm,
  Docker, and a physical MI300X.
